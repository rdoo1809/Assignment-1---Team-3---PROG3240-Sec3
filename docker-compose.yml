services:
  postgres:
    image: postgres:15
    container_name: unleash_postgres
    restart: always
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  unleash-server:
    image: unleashorg/unleash-server
    container_name: unleash_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unleash_user:unleash_pass@postgres:5432/unleash
      DATABASE_USERNAME: unleash_user
      DATABASE_PASSWORD: unleash_pass
      DATABASE_SSL: "false"
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  product-service:
    build:
      context: ./product_service
    container_name: product_service
    depends_on:
      unleash-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=docker
      - UNLEASH_API_URL=http://unleash-server:4242/api
      - UNLEASH_API_TOKEN=*:development.3ef732b18cf9e5f8c614de5cf09760a5f6a2e3d703da67fcb3d00430
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  order-service:
    build:
      context: ./order_service
    container_name: order_service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=docker
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - UNLEASH_API_URL=http://unleash-server:4242/api
      - UNLEASH_API_TOKEN=*:development.3ef732b18cf9e5f8c614de5cf09760a5f6a2e3d703da67fcb3d00430
    depends_on:
      unleash-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data:
name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & test Product Service
        working-directory: product_service
        env:
          UNLEASH_API_URL: http://localhost:4242/api
          UNLEASH_API_TOKEN: default:development.unleash-insecure-api-token
        run: mvn clean test

      - name: Build & test Order Service
        working-directory: order_service
        env:
          UNLEASH_API_URL: http://localhost:4242/api
          UNLEASH_API_TOKEN: default:development.unleash-insecure-api-token
          UNLEASH_APP_NAME: order-service
        run: mvn clean test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            product_service/target/surefire-reports
            order_service/target/surefire-reports

  docker-integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for services..."
          sleep 60

      - name: Initialize feature flags
        run: bash scripts/init-flags.sh

      - name: Test premium pricing flag
        run: |
          RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          echo "$RESPONSE"

      - name: Stop stack
        run: docker compose down

  feature-flag-validation:
    runs-on: ubuntu-latest
    needs: docker-integration-test

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services
        run: sleep 60

      - name: Verify flags exist
        run: |
          curl -H "Authorization: Bearer default:development.unleash-insecure-admin-api-token" \
          http://localhost:4242/api/admin/projects/default/features

      - name: Test feature flag toggle
        run: |
          curl -X POST "http://localhost:4242/api/admin/projects/default/features/premium-pricing/environments/development/on" \
          -H "Authorization: Bearer default:development.unleash-insecure-admin-api-token"
          RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          echo "$RESPONSE" | jq '.[] | select(.price != null)'

      - name: Stop stack
        run: docker compose down